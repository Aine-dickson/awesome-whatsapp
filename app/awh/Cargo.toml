[package]
name = "awh"
version = "0.1.0"
edition = "2021"

[workspace]
members = [".", "migration", "entity"]

[dependencies]
actix-web = "4.9.0"
sea-orm = {version = "1.1.4", features = ["sqlx-mysql", "runtime-tokio-native-tls", "macros"]}
jsonwebtoken = "9.3.0"
actix-cors = "0.7.0"
validator = {version = "0.20.0", features=["derive"]}

migration = {path = "migration"}
entity = {path = "entity"}
serde = "1.0.217"
serde_json = "1.0.137"
lazy_static = "1.5.0"
regex = "1.11.1"
dotenvy = "0.15.7"
uuid = {version="1.12.1", features=["v4"]}
resend-rs = "0.11.2"
rand = "0.8.5"
